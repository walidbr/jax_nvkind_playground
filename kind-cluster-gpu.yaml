kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nvkind-cluster
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /home/walid/repo/jax_cluster_lab
    containerPath: /workspace
  # Mount NVIDIA GPU into kind node
  extraPortMappings:
  - containerPort: 12345
    hostPort: 12345
    protocol: TCP
- role: worker
  extraMounts:
  - hostPath: /home/walid/repo/jax_cluster_lab
    containerPath: /workspace
